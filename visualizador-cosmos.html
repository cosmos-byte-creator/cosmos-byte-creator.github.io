<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>Cosmos Burguer — Comparador de versões</title>
  <style>
    :root{color-scheme:dark;--fundo:#09090b;--painel:#111012;--linha:rgba(255,196,95,.22);--creme:#f5eee4;--fosco:#b3a99f;--ouro:#ffc45f;--brasa:#ed6a1d}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:var(--fundo);color:var(--creme);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
    .barra{position:relative;z-index:2;min-width:0;padding:12px clamp(12px,3vw,28px);border-bottom:1px solid var(--linha);background:linear-gradient(120deg,#151113,#0b0a0c 70%);box-shadow:0 8px 28px #0008}
    .topo{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-width:0;max-width:1600px;margin:auto}
    .marca{min-width:0}.marca strong{display:block;font-size:clamp(14px,2vw,19px);letter-spacing:.08em}.marca span{display:block;margin-top:3px;color:var(--fosco);font-size:11px}
    .acoes{display:flex;align-items:center;gap:8px;min-width:0}
    .acao{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 14px;border:1px solid rgba(255,196,95,.38);border-radius:999px;background:#171416;color:var(--creme);font:800 11px/1 system-ui,-apple-system,"Segoe UI",sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer}
    .acao-destaque{border-color:rgba(255,196,95,.6);background:#26170c;color:var(--ouro)}
    .abas{display:flex;gap:7px;max-width:1600px;margin:11px auto 0;overflow-x:auto;padding:2px 2px 5px;scrollbar-width:thin;scrollbar-color:#73502c transparent}
    .aba{flex:0 0 auto;min-height:42px;padding:0 14px;border:1px solid rgba(255,255,255,.11);border-radius:999px;background:#171517;color:#d4c9bd;font:700 11px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.035em;white-space:nowrap;cursor:pointer}
    .aba[aria-pressed="true"]{border-color:rgba(255,196,95,.8);background:linear-gradient(135deg,#ffd177,#ed7a24);color:#1b0b02;box-shadow:0 5px 18px #ed6a1d33}
    .aba:focus-visible,.acao:focus-visible{outline:3px solid var(--ouro);outline-offset:3px}
    .estado{max-width:1600px;margin:2px auto 0;color:var(--fosco);font-size:10px}
    .tela{position:relative;min-height:0;padding:0 clamp(0px,1vw,12px) 10px}
    iframe{display:block;width:100%;height:100%;border:1px solid rgba(255,196,95,.14);border-top:0;border-radius:0 0 12px 12px;background:#050506;color-scheme:dark;overscroll-behavior:contain;touch-action:pan-y}
    .carregando{position:absolute;z-index:1;top:16px;left:50%;transform:translateX(-50%);padding:9px 14px;border:1px solid rgba(255,196,95,.25);border-radius:999px;background:#111012;color:#e9d8c1;font-size:11px;box-shadow:0 6px 20px #0009}
    .carregando[hidden]{display:none}
    @media(max-width:560px){
      .barra{padding:9px 10px 7px}
      .topo{display:grid;grid-template-columns:minmax(0,1fr);gap:7px}.marca span{font-size:10px}
      .acoes{display:flex;flex-wrap:nowrap;width:100%;gap:5px}
      .acao{flex:1 1 0;min-width:0;min-height:40px;padding:4px 3px;font-size:9px;line-height:1.15;white-space:normal;text-align:center}
      .abas{gap:6px;margin-top:8px}
      .aba{min-height:42px;padding-inline:12px;font-size:10px}
      .estado{font-size:9px}
      .tela{padding:0 0 env(safe-area-inset-bottom,0px)}
      iframe{border-radius:0;border-inline:0}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.001ms!important;transition-duration:.001ms!important}}
  </style>
</head>

    };
    const NOMES = {
      original: ["Original · arquivo principal do site", "Cosmos Burguer — Original"],
      teste1: ["Teste 1 · UX Refinada", "Cosmos Burguer — Teste 1 · UX Refinada"],
      teste2: ["Teste 2 · UX Comercial", "Cosmos Burguer — Teste 2 · UX Comercial"],
      teste3: ["Teste 3 · UX Imersiva", "Cosmos Burguer — Teste 3 · UX Imersiva"]
    };
    const iframe = document.getElementById("site");
    const estado = document.getElementById("estado");
    const carregando = document.getElementById("carregando");
    const abrirInteira = document.getElementById("abrir-inteira");
    const baixarVersao = document.getElementById("baixar-versao");
    const botoes = Array.from(document.querySelectorAll("[data-versao]"));
    let htmlAtual = "";
    let versaoAtual = "original";
    let carregamentoAtual = 0;
    const decodificar = valor => new TextDecoder().decode(Uint8Array.from(atob(valor), c => c.charCodeAt(0)));
    function abrirVersao(chave) {
      let html = decodificar(PAGINAS[chave]);
      html = html.replace(/(^|[\"'(=\s])\.?\/?images\//g, "$1https://cosmos-byte-creator.github.io/images/");
      html = html.replace("</style>", "html{scrollbar-color:#73502c #09090b} body{scrollbar-color:#73502c #09090b}</style>");
      html = html.replace('const previa = new URLSearchParams(window.location.search).has("preview");', "const previa = true;");
      htmlAtual = html;
      versaoAtual = chave;
      carregamentoAtual += 1;
      carregando.hidden = false;
      iframe.srcdoc = html;
      iframe.title = NOMES[chave][1];
      estado.textContent = NOMES[chave][0];
      botoes.forEach(botao => botao.setAttribute("aria-pressed", String(botao.dataset.versao === chave)));
    }
    iframe.addEventListener("load", async () => {
      const chamada = carregamentoAtual;
      try {
        const documento = iframe.contentDocument;
        const imagens = [documento.querySelector(".hero-media img"), documento.querySelector("#sistema img")].filter(Boolean);
        await Promise.race([
          Promise.all(imagens.map(imagem => imagem.decode ? imagem.decode().catch(() => {}) : Promise.resolve())),
          new Promise(resolve => setTimeout(resolve, 15000))
        ]);
      } catch (_) {}
      if (chamada === carregamentoAtual) carregando.hidden = true;
    });
    abrirInteira.addEventListener("click", () => {
      const url = URL.createObjectURL(new Blob([htmlAtual], { type:"text/html;charset=utf-8" }));
      const janela = window.open(url, "_blank");
      if (!janela) {
        const link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener";
        link.click();
      }
      setTimeout(() => URL.revokeObjectURL(url), 120000);
    });
    baixarVersao.addEventListener("click", () => {
      const nomes = { original:"original", teste1:"teste-1-ux-refinada", teste2:"teste-2-ux-comercial", teste3:"teste-3-ux-imersiva" };
      const url = URL.createObjectURL(new Blob([htmlAtual], { type:"text/html;charset=utf-8" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = `cosmos-${nomes[versaoAtual]}.html`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 120000);
    });
    botoes.forEach(botao => botao.addEventListener("click", () => abrirVersao(botao.dataset.versao)));
    const solicitada = new URLSearchParams(window.location.search).get("versao");
    abrirVersao(Object.prototype.hasOwnProperty.call(PAGINAS, solicitada) ? solicitada : "original");
  </script>
